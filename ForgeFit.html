 }else{let pool=EX.filter(x=>x.type===kind&&compatible(x));if(!pool.length)pool=EX.filter(x=>x.type===kind&&['brisk_walk','march','mobility'].includes(x.id));let block=Math.max(2,Math.min(6,Math.round(minutes/8)));items=pool.sort(()=>Math.random()-.5).slice(0,S.buildMode==='count'?S.exerciseCount:block).map(makeWorkoutEx)}

let foodCategory='cook',foodQuery='';
function foodText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setFoodCategory(c){foodCategory=c;foodQuery='';render();}
function foodResults(){
 const q=foodQuery.toLowerCase().trim();
 const target=document.getElementById('foodResults');if(!target)return;
 if(foodCategory==='facts'){
  const list=FOOD_FACTS.filter(f=>f.join(' ').toLowerCase().includes(q));
  target.innerHTML=`<p class="small muted" role="status">${list.length} foods and meals</p>`+(list.map((f)=>{const id=FOOD_FACTS.indexOf(f);return `<article class="card"><h3>${foodText(f[0])}</h3><p class="small muted">Reference portion: ${foodText(f[1])}</p>${f[8]?`<details class="details"><summary>Meal ingredients</summary><p class="small">${foodText(f[8])}. No extra sauce, drink, or topping included.</p></details>`:''}<div class="field"><label for="portion-${id}">Portions of the reference serving</label><input id="portion-${id}" type="number" min="0.25" max="20" step="0.25" value="1" oninput="scaleFood(${id},this.value)"></div><div id="nutrients-${id}">${foodNutrients(f,1)}</div><p class="small muted">${foodText(f[7]||'Approximate generic values; brands and preparation vary.')}</p></article>`}).join('')||'<div class="empty">No matches. Try chicken, oats, pasta, or yogurt.</div>');
 }else{
 const list=FOOD_SWAPS.filter(f=>f.cat===foodCategory&&[f.title,f.swap,f.note,f.goal].join(' ').toLowerCase().includes(q));
 target.innerHTML=`<p class="small muted" role="status">${list.length} substitutions</p>`+(list.map(f=>`<article class="card"><span class="tag">${foodText(f.goal)}</span><h3 style="margin-top:10px">${foodText(f.title)}</h3><p><b>Try:</b> ${foodText(f.swap)}</p>${f.cal?`<div class="notice">${foodText(f.cal)}</div>`:''}<p class="small muted" style="margin-top:10px">${foodText(f.note)}</p></article>`).join('')||'<div class="empty">No matches in this section. Try another section or a simpler search.</div>');
 }
}
function foodNutrients(f,n){return '<div class="grid3">'+['Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)','Fiber (g)'].map((label,j)=>`<div class="stat"><span class="small">${label}</span><strong>${Math.round(f[j+2]*n*10)/10}</strong></div>`).join('')+'</div>';}
function scaleFood(id,value){const n=Number(value),el=document.getElementById('nutrients-'+id);el.innerHTML=Number.isFinite(n)&&n>=.25&&n<=20?foodNutrients(FOOD_FACTS[id],n):'<p class="small">Enter between 0.25 and 20 portions.</p>';}
function food(){return `<div class="container"><section class="card hero"><div class="eyebrow">Cooking · cravings · eating out</div><h1>Food substitutions</h1><p>Keep the flavors you enjoy. Find an ingredient alternative, a lighter option, or more protein and fiber.</p><div class="seg" role="group" aria-label="Food sections">${[['cook','Cooking'],['sweet','Sweet'],['salty','Salty'],['restaurant','Restaurants'],['facts','Nutrition']].map(([id,label])=>`<button class="${foodCategory===id?'active':''}" aria-pressed="${foodCategory===id}" onclick="setFoodCategory('${id}')">${label}</button>`).join('')}</div><div class="field" style="margin-top:16px"><label for="foodSearch">Search this section</label><input id="foodSearch" type="search" placeholder="Try butter, chocolate, burger, chicken…" value="${foodText(foodQuery)}" oninput="foodQuery=this.value;foodResults()"></div><p class="small muted">${foodCategory==='restaurant'?'Restaurant calories are broad illustrative ranges, not verified chain menu values. Portions, sauces, sides, and drinks can change the total. Check the restaurant’s current nutrition information for exact orders.':foodCategory==='facts'?'Reference estimates, not product labels. Portions scale all displayed nutrients. Meal totals are calculated from the listed ingredients; actual recipes vary.':'A broad practical collection, not every possible substitution. Baking swaps depend on the recipe. Lower-calorie, higher-protein, and ingredient alternatives are labeled separately.'}</p></section>${foodCategory==='sweet'||foodCategory==='salty'?'<section class="card"><h3>Match the craving</h3><p class="small">Think about sweet or salty, creamy or crunchy, and warm or cold. If you are hungry, choose a satisfying snack with protein. If you are thirsty, have some water too. A smaller portion of the food you want is always an option.</p></section>':''}<div id="foodResults"></div><section class="card"><details><summary><b>How to compare foods</b></summary><ul class="list small"><li>Compare the same amount: grams, cups, or a clearly defined meal.</li><li>Measure calorie-dense additions such as oil, butter, dressing, nuts, and cheese.</li><li>Whole-grain, gluten-free, vegan, and low-carb do not automatically mean lower-calorie.</li><li>For packaged foods, use the product label for sodium, added sugar, saturated fat, and micronutrients. Missing values here are unknown, not zero.</li><li>For ingredient exclusions, check labels and restaurant preparation; swaps can introduce different allergens.</li></ul></details><details class="details"><summary>Reference sources</summary><p class="small">Cooking guidance: <a href="https://extension.umd.edu/resource/recipe-swaps-common-substitutions-making-recipes-healthier-fs-1174" target="_blank" rel="noopener">University of Maryland Extension</a>. Dining guidance: <a href="https://www.fda.gov/food/nutrition-education-resources-materials/calories-menu" target="_blank" rel="noopener">FDA menu calories</a>. Selected fruit and seafood entries: <a href="https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/nutrition-information-raw-fruits-vegetables-and-fish" target="_blank" rel="noopener">FDA nutrition tables</a>. Other foods are rounded generic estimates; meals are calculated examples.</p></details></section></div>`;}

function render(){document.getElementById('headerMode').textContent=activeWorkout?(activeWorkout.kind==='strength'?'Strength':activeWorkout.kind==='conditioning'?'Stamina':'Recovery'):'Adaptive';document.getElementById('app').innerHTML=tab==='today'?today():tab==='history'?history():tab==='progress'?progress():tab==='food'?food():settings();if(tab==='food')foodResults();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script>
</body>
</html>
